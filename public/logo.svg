<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#022C22" />
      <stop offset="100%" stop-color="#011C15" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FFFBEB" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded emblem -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="102" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.4" />

  <!-- Outer Hilal (Crescent) Subtle Arc -->
  <path d="M 380 132 C 430 210 420 310 360 380 C 290 450 180 440 120 380 C 170 410 250 400 300 350 C 350 300 360 210 320 150 C 342 140 363 134 380 132 Z" 
        fill="url(#goldAccent)" opacity="0.25" />

  <!-- Monogram H Golden Structure -->
  <!-- Left Pillar -->
  <path d="M 148 116 L 198 116 L 198 396 L 148 396 Z" fill="url(#goldGrad)" rx="8" filter="url(#goldGlow)" />
  <!-- Left Pillar Inner Bevel Highlight -->
  <path d="M 152 120 L 164 120 L 164 392 L 152 392 Z" fill="#FFFBEB" opacity="0.6" />

  <!-- Right Pillar -->
  <path d="M 314 116 L 364 116 L 364 396 L 314 396 Z" fill="url(#goldGrad)" rx="8" filter="url(#goldGlow)" />
  <!-- Right Pillar Inner Bevel Highlight -->
  <path d="M 318 120 L 330 120 L 330 392 L 318 392 Z" fill="#FFFBEB" opacity="0.6" />

  <!-- Crossbar with Hilal Crescent Curve / Diamond Accent -->
  <path d="M 198 226 L 314 226 L 314 278 L 198 278 Z" fill="url(#goldGrad)" />
  <!-- Elegant Diamond Inlay at Center -->
  <polygon points="256,220 278,252 256,284 234,252" fill="url(#goldAccent)" stroke="#022C22" stroke-width="2" />
  <circle cx="256" cy="252" r="5" fill="#FFFBEB" />

  <!-- Crown / Top Serif Flourish -->
  <path d="M 136 122 L 210 122 L 204 134 L 142 134 Z" fill="url(#goldAccent)" />
  <path d="M 302 122 L 376 122 L 370 134 L 308 134 Z" fill="url(#goldAccent)" />
  <!-- Bottom Serif Flourish -->
  <path d="M 136 390 L 210 390 L 204 378 L 142 378 Z" fill="url(#goldAccent)" />
  <path d="M 302 390 L 376 390 L 370 378 L 308 378 Z" fill="url(#goldAccent)" />

  <!-- Bottom Brand Subtitle Spark -->
  <circle cx="256" cy="442" r="4" fill="#FBBF24" opacity="0.8" />
  <line x1="210" y1="442" x2="242" y2="442" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
  <line x1="270" y1="442" x2="302" y2="442" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
</svg>
